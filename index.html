<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi 1Money Cloud</title>
    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #10b981;
            --danger: #ef4444;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 20px; color: var(--text); }
        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); margin-bottom: 15px; border: 1px solid var(--border); }
        .balance-title { font-size: 13px; color: var(--text-muted); text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        .balance-amount { text-align: center; font-size: 32px; font-weight: 800; color: var(--accent); margin: 5px 0 15px 0; }
        .accounts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .account-badge { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; text-align: center; border: 1px solid var(--border); }
        .account-badge span { display: block; font-size: 11px; color: var(--text-muted); }
        .account-badge strong { font-size: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 13px; color: var(--text-muted); }
        select, input { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; outline: none; }
        select:focus, input:focus { border-color: var(--accent); }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { padding: 14px; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; color: white; transition: opacity 0.2s; }
        .btn-income { background-color: var(--accent); }
        .btn-expense { background-color: var(--danger); }
        button:hover { opacity: 0.85; }
        .section-title { font-size: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .transaction-list { list-style: none; max-height: 280px; overflow-y: auto; }
        .transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
        .delete-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 5px; }
        .delete-btn:hover { color: var(--danger); }
        .empty-state { text-align: center; color: var(--text-muted); padding: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>☁️ 1Money Cloud</h1>
            <span id="syncStatus" style="font-size: 11px; color: var(--accent);">Conectando...</span>
        </header>

        <div class="card">
            <div class="balance-title">Balance Total</div>
            <div class="balance-amount" id="totalBalance">$0.00</div>
            <div class="accounts-grid">
                <div class="account-badge">
                    <span>Efectivo</span>
                    <strong id="cashBalance">$0.00</strong>
                </div>
                <div class="account-badge">
                    <span>Banco / Tarjeta</span>
                    <strong id="bankBalance">$0.00</strong>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="form-group">
                <label>Cuenta</label>
                <select id="account">
                    <option value="Efectivo">💵 Efectivo</option>
                    <option value="Banco">💳 Banco / Tarjeta</option>
                </select>
            </div>
            <div class="form-group">
                <label>Categoría</label>
                <select id="category">
                    <option value="Comida">🍔 Comida / Supermercado</option>
                    <option value="Transporte">🚗 Transporte / Gasolina</option>
                    <option value="Salario">💰 Salario / Ingreso</option>
                    <option value="Entretenimiento">🎉 Entretenimiento</option>
                    <option value="Vivienda">🏠 Vivienda / Servicios</option>
                    <option value="Otros">📦 Otros</option>
                </select>
            </div>
            <div class="form-group">
                <label>Monto ($)</label>
                <input type="number" id="amount" placeholder="0.00" step="0.01">
            </div>
            <div class="form-group">
                <label>Nota (Opcional)</label>
                <input type="text" id="note" placeholder="Ej. Almuerzo con amigos">
            </div>
            <div class="btn-group">
                <button class="btn-expense" onclick="addTransaction('Gasto')">Gasto 📉</button>
                <button class="btn-income" onclick="addTransaction('Ingreso')">Ingreso 📈</button>
            </div>
        </div>

        <div class="card">
            <div class="section-title">
                <span>Historial en la Nube</span>
                <span id="txCount" style="font-size: 12px; color: var(--text-muted);">0 transacciones</span>
            </div>
            <ul class="transaction-list" id="transactionList">
                <div class="empty-state">Cargando datos...</div>
            </ul>
        </div>
    </div>

    <script>
        // 🔑 PEGA AQUÍ TUS DATOS DE SUPABASE
        const SUPABASE_URL = 'https://flxsufbwttizbqtymqrb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_5R_cgDMLtMh9JQPpUow5YQ_epltv-V6';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let transactions = [];

        async function fetchTransactions() {
            document.getElementById('syncStatus').textContent = 'Sincronizando...';
            const { data, error } = await _supabase
                .from('transactions')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error al cargar:', error);
                document.getElementById('syncStatus').textContent = 'Error de conexión';
            } else {
                transactions = data || [];
                document.getElementById('syncStatus').textContent = '🟢 En línea';
                updateUI();
            }
        }

        async function addTransaction(type) {
            const account = document.getElementById('account').value;
            const category = document.getElementById('category').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const note = document.getElementById('note').value;

            if (!amount || amount <= 0) {
                alert("Por favor ingresa un monto válido.");
                return;
            }

            const newTx = { type, account, category, amount, note };

            const { error } = await _supabase.from('transactions').insert([newTx]);

            if (error) {
                alert('Hubo un error al guardar en Supabase.');
                console.error(error);
            } else {
                document.getElementById('amount').value = '';
                document.getElementById('note').value = '';
                fetchTransactions();
            }
        }

        async function deleteTransaction(id) {
            if (confirm("¿Estás seguro de eliminar este movimiento?")) {
                const { error } = await _supabase.from('transactions').delete().eq('id', id);
                if (error) {
                    alert('Error al eliminar');
                } else {
                    fetchTransactions();
                }
            }
        }

        function updateUI() {
            const list = document.getElementById('transactionList');
            const balanceEl = document.getElementById('totalBalance');
            const cashEl = document.getElementById('cashBalance');
            const bankEl = document.getElementById('bankBalance');
            const txCountEl = document.getElementById('txCount');
            
            list.innerHTML = '';
            let total = 0, cashTotal = 0, bankTotal = 0;

            if (transactions.length === 0) {
                list.innerHTML = '<div class="empty-state">No hay movimientos registrados</div>';
            } else {
                transactions.forEach((t) => {
                    const amt = Number(t.amount);
                    if (t.type === 'Ingreso') {
                        total += amt;
                        if (t.account === 'Efectivo') cashTotal += amt;
                        else bankTotal += amt;
                    } else {
                        total -= amt;
                        if (t.account === 'Efectivo') cashTotal -= amt;
                        else bankTotal -= amt;
                    }

                    const li = document.createElement('li');
                    li.className = 'transaction-item';
                    li.innerHTML = `
                        <div>
                            <strong>${t.category}</strong> <span style="font-size:11px; color:var(--text-muted);">(${t.account})</span><br>
                            <small style="color:var(--text-muted);">${t.note || 'Sin nota'}</small>
                        </div>
                        <div style="text-align: right; display: flex; align-items: center; gap: 8px;">
                            <span style="font-weight: bold; color: ${t.type === 'Ingreso' ? 'var(--accent)' : 'var(--danger)'}">
                                ${t.type === 'Ingreso' ? '+' : '-'}$${amt.toFixed(2)}
                            </span>
                            <button class="delete-btn" onclick="deleteTransaction(${t.id})">&times;</button>
                        </div>
                    `;
                    list.appendChild(li);
                });
            }

            balanceEl.textContent = `$${total.toFixed(2)}`;
            cashEl.textContent = `$${cashTotal.toFixed(2)}`;
            bankEl.textContent = `$${bankTotal.toFixed(2)}`;
            txCountEl.textContent = `${transactions.length} transacciones`;
        }

        fetchTransactions();
    </script>
</body>
</html>
